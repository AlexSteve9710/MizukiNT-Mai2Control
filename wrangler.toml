# Cloudflare Worker 配置 —— SDEZ 远程控制台 (Hibernatable WebSocket)
# 用法： npx wrangler deploy
#
# 架构：Worker + Durable Object，使用 WebSocket Hibernation API 实现「无服务器」WS。
#   - DO isolate 在没有消息往来时会被驱逐回收，下一条消息进来时再唤起
#   - 不需要长跑的进程 / 容器，闲置不计费
#
# 路由（与 DLL 里 URL_PREFIX 相互配套）：
#   wss://<worker-host>/token?=<KEY>     ← cabinet 入口（兼容用户偏好的 mai2.../token?= 写法）
#   wss://<worker-host>/admin?key=<KEY>  ← admin 浏览器控制台入口
#   https://<worker-host>/               ← 控制台 HTML

name = "mai2-contorl"
main = "worker.js"
# 提到一个有 hibernation API 的版本即可（>= 2024-08-15）
compatibility_date = "2024-12-01"

# 控制台默认填进去的 cabinet key（admin 浏览器侧的便利项；可留空）
[vars]
DEFAULT_CABINET_KEY = ""    # 留空让管理员手填
ADMIN_TOKEN         = ""    # ⚠️ 已废弃 —— 控制台改走「KV 账户 + 登录会话」模型；
                            #    本字段保留是为了不破坏老的 wrangler.toml diff，运行时不再读取。
CABINET_TOKEN       = ""    # cabinet 端 token；留空=不鉴权（推荐生产填）

# 推荐用 secret 存：
#   npx wrangler secret put CABINET_TOKEN

# Durable Object：每个 cabinet key 一个实例，承载 cabinet/admin 双向 WebSocket
[[durable_objects.bindings]]
name = "CABINETS"
class_name = "CabinetBroker"

# DO 类需要在 migrations 里声明
# 注意：免费 plan 只支持 SQLite-backed DO，必须用 new_sqlite_classes
# （API 错误码 10097：In order to use Durable Objects with a free plan,
#   you must create a namespace using a `new_sqlite_classes` migration）
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CabinetBroker"]

# ============================================================
# KV namespace「AUTH」 —— 多账户登录系统的真相之源
#
#   user:<username>      → JSON {salt, hash (PBKDF2-SHA256 100k), createdAt, role, cabinets:[…]}
#   session:<token>      → JSON {username, createdAt}        (TTL 24h, 由 KV 自动清理)
#   lockout:<ip>         → JSON {fails, lockedUntil}         (TTL 5min, 防穷举)
#
# 首次部署步骤：
#   1) wrangler kv namespace create AUTH                → 拿 production id 填到下面 id=
#   2) wrangler kv namespace create AUTH --preview      → 拿 preview id 填到 preview_id=
#   3) node tools/make-user.mjs <user> <pass>           → 跑出来的 wrangler kv key put 命令执行一次
#   4) wrangler deploy                                  → 上线后访问 / 应该被 302 跳到 /login
# ============================================================
[[kv_namespaces]]
binding     = "AUTH"
id          = "c189c8111fb74b77b8f50275baa11e30"           # ← TODO: 填 `wrangler kv namespace create AUTH` 输出的 id
preview_id  = "c189c8111fb74b77b8f50275baa11e30"           # ← TODO: 填 `wrangler kv namespace create AUTH --preview` 输出的 id
